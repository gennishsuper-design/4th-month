{% extends 'base.html' %}

{% block title %}
<title>Удалить пост — {{ post.title }}</title>
{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="mb-3">Вы уверены, что хотите удалить этот пост?</h3>
          <p class="mb-4"><strong>{{ post.title }}</strong></p>

          <form method="post" action="">
            {% csrf_token %}
            <a href="{% url 'post_detail' post.id %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-danger">Да, удалить</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
